<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RigPass — Employer Profile</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1e3a8a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh}
:root{
  --blue:#1e3a8a;--blue-mid:#1e40af;--blue-lt:#dbeafe;--blue-border:#93c5fd;--navy:#0a1228;
  --border:#e2e8f0;--text:#0f172a;--muted:#475569;--light:#94a3b8;
  --green:#166534;--green-bg:#f0fdf4;--red:#991b1b;--red-bg:#fef2f2;
  --amber:#92400e;--amber-bg:#fefce8;--gold:#b8923a;--gold-border:#c9963a;
}

.topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand-logo{width:32px;height:32px;background:var(--blue);border-radius:8px;display:grid;place-items:center}
.brand-logo svg{width:15px;height:15px;fill:#fff}
.brand-text{font-size:1rem;font-weight:800;color:var(--text);letter-spacing:-.3px}
.brand-text span{color:var(--blue)}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:7px}
.back-link:hover{background:#f1f5f9;color:var(--text)}

.container{max-width:960px;margin:24px auto;padding:0 24px}

.hero{
  background:linear-gradient(135deg,#1e3a8a 0%,#0a1228 100%);
  border-radius:16px;padding:32px;color:#fff;margin-bottom:18px;position:relative;overflow:hidden;
}
.hero::before{content:'';position:absolute;inset:0;opacity:.05;background-image:linear-gradient(rgba(255,255,255,1) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,1) 1px,transparent 1px);background-size:36px 36px}
.hero::after{content:'';position:absolute;top:-50px;right:-50px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(184,146,58,.18) 0%,transparent 70%)}
.hero-inner{position:relative;z-index:2;display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.hero-avatar{width:80px;height:80px;border-radius:18px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:1.6rem;font-weight:800;flex-shrink:0;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.hero-info{flex:1;min-width:200px}
.hero-name{font-size:1.55rem;font-weight:800;color:#fff;letter-spacing:-.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:5px}
.hero-verified{font-size:.66rem;color:#86efac;background:rgba(22,101,52,.3);border:1px solid rgba(134,239,172,.4);padding:3px 8px;border-radius:5px;text-transform:uppercase;letter-spacing:.5px;font-weight:800}
.hero-role{font-size:1rem;color:rgba(255,255,255,.85);font-weight:600;margin-bottom:12px}
.hero-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:.84rem;color:rgba(255,255,255,.7)}
.hero-meta span{display:inline-flex;align-items:center;gap:6px}

.body-grid{display:grid;grid-template-columns:1fr 320px;gap:18px}
@media(max-width:880px){.body-grid{grid-template-columns:1fr}}

.card{background:#fff;border:1.5px solid var(--gold-border);border-radius:12px;padding:22px 24px;margin-bottom:18px}
.card-title{font-size:1rem;font-weight:800;color:var(--text);letter-spacing:-.2px;margin-bottom:14px}

.bio{font-size:.9rem;line-height:1.65;color:var(--muted)}

/* Job rows */
.job-row{
  display:block;padding:14px 0;border-top:1px solid #f1f5f9;text-decoration:none;color:var(--text);
}
.job-row:first-child{border-top:none}
.job-row:hover .job-row-title{color:var(--blue)}
.job-row-title{font-size:.95rem;font-weight:800;color:var(--text);letter-spacing:-.2px;transition:color .15s}
.job-row-meta{display:flex;gap:14px;font-size:.76rem;color:var(--muted);margin-top:4px;flex-wrap:wrap;font-weight:600}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat-mini{background:var(--off);border:1px solid var(--border);border-radius:9px;padding:11px 12px}
.stat-mini-label{font-size:.66rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.stat-mini-value{font-size:1.05rem;font-weight:800;color:var(--text);letter-spacing:-.2px}

.detail-row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #f1f5f9;font-size:.85rem}
.detail-row:first-of-type{border-top:none}
.detail-label{color:var(--muted);font-weight:600}
.detail-value{color:var(--text);font-weight:700;text-align:right}
</style>
</head>
<body>

<div class="topbar">
  <a href="dashboard.html" class="brand">
    <div class="brand-logo"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg></div>
    <span class="brand-text">Rig<span>Pass</span></span>
  </a>
  <a href="javascript:history.back()" class="back-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </a>
</div>

<div class="container">
  <div id="loading" style="text-align:center;padding:80px 22px;color:var(--light)">Loading employer...</div>
  <div id="content" style="display:none"></div>
</div>

<script>
const SUPABASE_URL = 'https://nbpyydgqqdozdpexmwlh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0g2EY2H1H6l93414OVlnlQ_GxqqL_o6';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const params = new URLSearchParams(window.location.search);
const employerId = params.get('id');

async function init(){
  if(!employerId){
    document.getElementById('loading').innerHTML = '<p style="color:var(--red);font-weight:700">No employer ID provided.</p>';
    return;
  }

  // Anyone signed in can view
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'login.html'; return; }

  const { data: employer } = await sb.from('profiles').select('*').eq('id', employerId).eq('role', 'employer').single();
  if(!employer){
    document.getElementById('loading').innerHTML = '<p style="color:var(--muted);font-weight:600">Employer not found.</p>';
    return;
  }

  // Fetch their active jobs
  const { data: jobs } = await sb
    .from('jobs')
    .select('*')
    .eq('employer_id', employerId)
    .eq('status', 'active')
    .order('published_at', { ascending: false });

  renderEmployer(employer, jobs || []);
}

function renderEmployer(employer, jobs){
  const company = employer.company_name || ((employer.first_name || '') + ' ' + (employer.last_name || '')).trim() || 'Employer';
  const initials = company.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  const contactName = ((employer.first_name || '') + ' ' + (employer.last_name || '')).trim() || 'Hiring Manager';
  const loc = [employer.city, employer.province].filter(Boolean).join(', ') || 'Location not set';
  const memberSince = new Date(employer.created_at).toLocaleDateString('en-CA', { month:'long', year:'numeric' });

  const html = `
    <div class="hero">
      <div class="hero-inner">
        <div class="hero-avatar">${initials}</div>
        <div class="hero-info">
          <div class="hero-name">${company}${employer.verification_status === 'approved' ? '<span class="hero-verified">✓ Verified Employer</span>' : ''}</div>
          <div class="hero-role">${employer.industry || 'Employer'}</div>
          <div class="hero-meta">
            <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${loc}</span>
            ${employer.company_size ? `<span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>${employer.company_size}</span>` : ''}
            <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/></svg>Member since ${memberSince}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="body-grid">
      <div>
        ${employer.bio ? `<div class="card">
          <div class="card-title">About ${company}</div>
          <div class="bio">${employer.bio}</div>
        </div>` : ''}

        <div class="card">
          <div class="card-title">Open Positions <span style="font-size:.78rem;font-weight:600;color:var(--light);margin-left:6px">${jobs.length} active</span></div>
          ${jobs.length === 0
            ? '<div style="padding:14px 0;color:var(--light);font-size:.85rem;font-style:italic">No open positions right now</div>'
            : jobs.map(job => {
                const jobLoc = [job.city, job.province].filter(Boolean).join(', ') || 'Location TBD';
                const pay = job.pay_min && job.pay_max ? `$${job.pay_min}–$${job.pay_max}${job.pay_type==='hourly'?'/hr':''}` : 'Pay TBD';
                const posted = timeAgo(job.published_at || job.created_at);
                return `<a href="jobs.html#job-${job.id}" class="job-row">
                  <div class="job-row-title">${job.title}</div>
                  <div class="job-row-meta">
                    <span>${job.trade || 'Trade not set'}</span>
                    <span>${jobLoc}</span>
                    <span>${pay}</span>
                    <span>Posted ${posted}</span>
                  </div>
                </a>`;
              }).join('')
          }
        </div>
      </div>

      <div>
        <div class="card">
          <div class="card-title">Company Details</div>
          <div class="stat-grid">
            <div class="stat-mini">
              <div class="stat-mini-label">Active Jobs</div>
              <div class="stat-mini-value">${jobs.length}</div>
            </div>
            <div class="stat-mini">
              <div class="stat-mini-label">Verified</div>
              <div class="stat-mini-value" style="color:${employer.verification_status === 'approved' ? 'var(--green)' : 'var(--amber)'}">${employer.verification_status === 'approved' ? '✓ Yes' : 'Pending'}</div>
            </div>
          </div>
          ${employer.industry ? `<div class="detail-row"><span class="detail-label">Industry</span><span class="detail-value">${employer.industry}</span></div>` : ''}
          ${employer.company_size ? `<div class="detail-row"><span class="detail-label">Size</span><span class="detail-value">${employer.company_size}</span></div>` : ''}
          <div class="detail-row"><span class="detail-label">Location</span><span class="detail-value">${loc}</span></div>
          <div class="detail-row"><span class="detail-label">Joined</span><span class="detail-value">${memberSince}</span></div>
        </div>

        <div class="card" style="background:#f0fdf4;border-color:#86efac">
          <div class="card-title" style="color:var(--green)">Trust & Safety</div>
          <p style="font-size:.82rem;color:#166534;line-height:1.55">
            ${employer.verification_status === 'approved'
              ? 'This employer has been verified by RigPass admin. Their company details and hiring legitimacy have been reviewed.'
              : 'This employer is still pending verification. Be cautious sharing personal information until they are approved.'}
          </p>
        </div>
      </div>
    </div>
  `;

  document.getElementById('loading').style.display = 'none';
  const content = document.getElementById('content');
  content.innerHTML = html;
  content.style.display = 'block';
}

function timeAgo(dateStr){
  if(!dateStr) return 'recently';
  const diff = Date.now() - new Date(dateStr).getTime();
  const days = Math.floor(diff / (1000*60*60*24));
  if(days < 1) return 'today';
  if(days === 1) return '1 day ago';
  if(days < 30) return days + ' days ago';
  return Math.floor(days/30) + 'mo ago';
}

init();
</script>
</body>
</html>

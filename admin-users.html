<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RigPass — All Users</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh;display:flex}
:root{
  --blue:#1e3a8a;--blue-mid:#1e40af;--blue-lt:#dbeafe;--blue-border:#93c5fd;
  --navy:#0a1228;--border:#e2e8f0;--text:#0f172a;--muted:#475569;--light:#94a3b8;
  --green:#166534;--green-bg:#f0fdf4;--red:#991b1b;--red-bg:#fef2f2;
  --amber:#92400e;--amber-bg:#fefce8;--gold:#b8923a;--gold-border:#c9963a;
  --off:#f8fafc;--shadow-lg:0 12px 28px rgba(15,23,42,.1);
}

.sidebar{width:240px;flex-shrink:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.sb-top{padding:22px 22px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:11px}
.sb-logo{width:34px;height:34px;background:var(--blue);border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.sb-logo svg{width:16px;height:16px;fill:#fff}
.sb-brand{font-size:1.05rem;font-weight:800;color:#fff;letter-spacing:-.2px;line-height:1.1}
.sb-brand span{color:#93c5fd}
.sb-tag{display:inline-block;font-size:.58rem;font-weight:800;color:var(--red);background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.7px;margin-top:3px}

.sb-nav{flex:1;padding:14px 0}
.sb-section{padding:0 12px;margin-bottom:6px}
.sb-link{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:7px;font-size:.85rem;font-weight:600;color:rgba(255,255,255,.65);text-decoration:none;margin-bottom:2px;position:relative;transition:all .15s}
.sb-link:hover{background:rgba(255,255,255,.05);color:#fff}
.sb-link.active{background:rgba(30,58,138,.4);color:#fff;font-weight:700}
.sb-link.active::before{content:'';position:absolute;left:-12px;top:6px;bottom:6px;width:3px;background:var(--gold);border-radius:0 3px 3px 0}
.sb-link svg{width:17px;height:17px;flex-shrink:0;stroke-width:2}
.sb-badge{margin-left:auto;background:var(--red);color:#fff;font-size:.62rem;font-weight:800;padding:1px 7px;border-radius:100px;min-width:18px;text-align:center}

.sb-bottom{padding:14px;border-top:1px solid rgba(255,255,255,.08)}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;position:relative}
.sb-user:hover{background:rgba(255,255,255,.05)}
.sb-avatar{width:34px;height:34px;border-radius:8px;background:var(--gold);display:grid;place-items:center;color:var(--navy);font-size:.74rem;font-weight:800;flex-shrink:0}
.sb-uname{font-size:.86rem;font-weight:700;color:#fff;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-urole{font-size:.7rem;color:rgba(255,255,255,.5);margin-top:2px}

.main{flex:1;padding:32px 40px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.tb-title{font-size:1.5rem;font-weight:800;color:var(--text);letter-spacing:-.5px}
.tb-sub{font-size:.78rem;color:var(--muted);margin-top:3px}

/* Filters bar */
.filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.search-input{flex:1;min-width:250px;padding:10px 14px;padding-left:38px;border-radius:9px;border:1.5px solid var(--border);background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%2394a3b8' stroke-width='2' viewBox='0 0 24 24'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 12px center;font-family:'Plus Jakarta Sans',sans-serif;font-size:.86rem;outline:none}
.search-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,58,138,.1)}
.filter-select{padding:10px 14px;border-radius:9px;border:1.5px solid var(--border);background:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-size:.84rem;color:var(--text);cursor:pointer;outline:none}

/* Table */
.table-card{background:#fff;border-radius:12px;border:1.5px solid var(--gold-border);overflow:hidden}
.table-head{background:var(--off);padding:11px 22px;border-bottom:1.5px solid var(--border);display:grid;grid-template-columns:2fr 1fr 1.2fr 1fr 100px;gap:14px;align-items:center;font-size:.7rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.user-row{padding:13px 22px;border-bottom:1px solid #f1f5f9;display:grid;grid-template-columns:2fr 1fr 1.2fr 1fr 100px;gap:14px;align-items:center;transition:background .15s}
.user-row:last-child{border-bottom:none}
.user-row:hover{background:#fafbfc}

.user-cell{display:flex;align-items:center;gap:11px;min-width:0}
.u-avatar{width:36px;height:36px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:800;flex-shrink:0}
.u-info{min-width:0}
.u-name{font-size:.88rem;font-weight:700;color:var(--text);letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-email{font-size:.74rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:5px;font-size:.66rem;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.tag-worker{background:var(--blue-lt);color:var(--blue);border:1px solid var(--blue-border)}
.tag-employer{background:#fdf8ee;color:var(--gold);border:1px solid #f3e3b8}
.tag-admin{background:var(--red-bg);color:var(--red);border:1px solid #fda4af}
.tag-pending{background:var(--amber-bg);color:var(--amber);border:1px solid #fde047}
.tag-approved{background:var(--green-bg);color:var(--green);border:1px solid #86efac}
.tag-rejected{background:var(--red-bg);color:var(--red);border:1px solid #fda4af}
.tag-suspended{background:#f1f5f9;color:var(--muted);border:1px solid var(--border)}

.cell-sub{font-size:.82rem;color:var(--text);font-weight:600}
.cell-meta{font-size:.74rem;color:var(--muted);margin-top:2px}

.action-menu{position:relative}
.action-btn{padding:7px 10px;background:#fff;border:1.5px solid var(--border);border-radius:7px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-size:.76rem;font-weight:700;color:var(--text);transition:all .15s}
.action-btn:hover{border-color:var(--light);background:var(--off)}

.dropdown{position:absolute;top:100%;right:0;margin-top:5px;background:#fff;border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow-lg);min-width:180px;z-index:50;overflow:hidden}
.dropdown button{width:100%;display:flex;align-items:center;gap:9px;padding:9px 13px;background:#fff;border:none;font-family:'Plus Jakarta Sans',sans-serif;font-size:.82rem;color:var(--text);cursor:pointer;text-align:left;font-weight:600;transition:background .15s}
.dropdown button:hover{background:var(--off)}
.dropdown button.danger{color:var(--red)}
.dropdown button.danger:hover{background:var(--red-bg)}

.empty-state{padding:60px 22px;text-align:center;color:var(--muted)}
.empty-state p{font-size:.95rem;font-weight:800;color:var(--text);margin-bottom:6px}
.empty-state span{font-size:.82rem;color:var(--muted)}

.results-info{font-size:.78rem;color:var(--muted);margin-bottom:14px}

@media(max-width:900px){
  .table-head{display:none}
  .user-row{grid-template-columns:1fr;gap:8px;padding:14px 18px}
  .user-cell{padding-bottom:6px;border-bottom:1px dashed var(--border);margin-bottom:6px}
}
@media(max-width:700px){
  .sidebar{width:64px}
  .sb-brand,.sb-link span:not(.sb-badge),.sb-uname,.sb-urole,.sb-tag{display:none}
  .sb-link{justify-content:center;padding:9px 0}
  .sb-user{justify-content:center;padding:0}
  .main{padding:20px}
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sb-top">
    <div class="sb-logo"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg></div>
    <div>
      <div class="sb-brand">Rig<span>Pass</span></div>
      <span class="sb-tag">Admin Console</span>
    </div>
  </div>

  <nav class="sb-nav">
    <div class="sb-section">
      <a class="sb-link" href="admin.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Dashboard</span>
      </a>
      <a class="sb-link" href="admin-verification.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>Verification</span>
        <span class="sb-badge" id="nav-verify-count">0</span>
      </a>
      <a class="sb-link active" href="admin-users.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
        <span>All Users</span>
      </a>
      <a class="sb-link" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        <span>All Postings</span>
      </a>
      <a class="sb-link" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Analytics</span>
      </a>
    </div>
  </nav>

  <div class="sb-bottom">
    <div class="sb-user" onclick="toggleUserMenu(event)">
      <div class="sb-avatar" id="sb-avatar">--</div>
      <div style="min-width:0">
        <div class="sb-uname" id="sb-uname">Loading...</div>
        <div class="sb-urole">Platform Admin</div>
      </div>
      <div id="user-menu" style="display:none;position:absolute;bottom:100%;left:0;right:0;margin-bottom:8px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.4);overflow:hidden;z-index:200">
        <button onclick="signOut()" style="width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:.85rem;color:var(--red);background:#fff;border:none;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;text-align:left" onmouseover="this.style.background='#fef2f2'" onmouseout="this.style.background='#fff'">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    </div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div>
      <div class="tb-title">All Users</div>
      <div class="tb-sub">Workers, employers, and admins across the platform</div>
    </div>
  </div>

  <div class="filters">
    <input class="search-input" type="search" placeholder="Search by name, email, or company..." oninput="filterUsers()" id="search-input">
    <select class="filter-select" id="filter-role" onchange="filterUsers()">
      <option value="">All roles</option>
      <option value="worker">Workers</option>
      <option value="employer">Employers</option>
      <option value="admin">Admins</option>
    </select>
    <select class="filter-select" id="filter-status" onchange="filterUsers()">
      <option value="">All statuses</option>
      <option value="approved">Approved</option>
      <option value="pending">Pending</option>
      <option value="rejected">Rejected</option>
      <option value="suspended">Suspended</option>
    </select>
  </div>

  <div class="results-info" id="results-info">Loading users...</div>

  <div class="table-card">
    <div class="table-head">
      <div>User</div>
      <div>Role</div>
      <div>Details</div>
      <div>Joined</div>
      <div>Actions</div>
    </div>
    <div id="users-table">
      <div class="empty-state"><p style="color:var(--muted);font-weight:500">Loading...</p></div>
    </div>
  </div>

</main>

<script>
const SUPABASE_URL = 'https://nbpyydgqqdozdpexmwlh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0g2EY2H1H6l93414OVlnlQ_GxqqL_o6';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allUsers = [];
let openMenu = null;

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'login.html'; return; }

  const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if(!profile || !profile.is_admin){
    alert('Admin access only.');
    window.location.href = 'dashboard.html';
    return;
  }

  const display = ((profile.first_name || '') + ' ' + (profile.last_name || '')).trim() || session.user.email.split('@')[0];
  const initials = display.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase() || 'AD';
  document.getElementById('sb-avatar').textContent = initials;
  document.getElementById('sb-uname').textContent = display;

  await loadUsers();
}

async function loadUsers(){
  const { data, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
  if(error){ console.error(error); return; }
  allUsers = data || [];

  // Update sidebar badge
  const pending = allUsers.filter(u => u.role === 'employer' && u.verification_status === 'pending').length;
  document.getElementById('nav-verify-count').textContent = pending;
  if(pending === 0) document.getElementById('nav-verify-count').style.display = 'none';

  filterUsers();
}

function filterUsers(){
  const search = document.getElementById('search-input').value.toLowerCase().trim();
  const roleFilter = document.getElementById('filter-role').value;
  const statusFilter = document.getElementById('filter-status').value;

  let filtered = allUsers.filter(u => {
    // Role filter
    if(roleFilter === 'admin' && !u.is_admin) return false;
    if(roleFilter && roleFilter !== 'admin' && u.role !== roleFilter) return false;

    // Status filter
    if(statusFilter === 'suspended' && !u.suspended) return false;
    if(statusFilter && statusFilter !== 'suspended' && u.verification_status !== statusFilter) return false;

    // Search filter
    if(search){
      const haystack = [
        u.first_name, u.last_name, u.email, u.company_name, u.trade, u.city
      ].filter(Boolean).join(' ').toLowerCase();
      if(!haystack.includes(search)) return false;
    }
    return true;
  });

  document.getElementById('results-info').textContent = `Showing ${filtered.length} of ${allUsers.length} users`;

  renderTable(filtered);
}

function renderTable(users){
  const table = document.getElementById('users-table');
  if(users.length === 0){
    table.innerHTML = `<div class="empty-state">
      <p>No users found</p>
      <span>Try adjusting your filters.</span>
    </div>`;
    return;
  }

  table.innerHTML = users.map(u => {
    const first = u.first_name || '';
    const last = u.last_name || '';
    const fullName = (first + ' ' + last).trim() || (u.company_name || u.email.split('@')[0]);
    const initials = ((first[0] || '') + (last[0] || '')).toUpperCase() || (u.company_name || u.email).substring(0,2).toUpperCase();

    const roleTag = u.is_admin
      ? '<span class="tag tag-admin">Admin</span>'
      : u.role === 'employer'
      ? '<span class="tag tag-employer">Employer</span>'
      : '<span class="tag tag-worker">Worker</span>';

    let statusTag = '';
    if(u.suspended){
      statusTag = '<span class="tag tag-suspended">Suspended</span>';
    } else if(u.role === 'employer'){
      const cls = u.verification_status === 'approved' ? 'tag-approved' : u.verification_status === 'rejected' ? 'tag-rejected' : 'tag-pending';
      statusTag = `<span class="tag ${cls}">${u.verification_status || 'pending'}</span>`;
    }

    const sub = u.role === 'worker' ? (u.trade || 'Worker') : (u.company_name || '—');
    const loc = [u.city, u.province].filter(Boolean).join(', ');

    const joined = new Date(u.created_at).toLocaleDateString('en-CA', { month:'short', day:'numeric', year:'numeric' });

    return `<div class="user-row">
      <div class="user-cell">
        <div class="u-avatar">${initials}</div>
        <div class="u-info">
          <div class="u-name">${fullName}</div>
          <div class="u-email">${u.email}</div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start">${roleTag}${statusTag}</div>
      <div>
        <div class="cell-sub">${sub}</div>
        ${loc ? `<div class="cell-meta">${loc}</div>` : ''}
      </div>
      <div class="cell-sub" style="color:var(--muted);font-weight:500;font-size:.78rem">${joined}</div>
      <div class="action-menu">
        <button class="action-btn" onclick="toggleMenu(event,'${u.id}')">Actions ▾</button>
        <div class="dropdown" id="menu-${u.id}" style="display:none">
          ${u.role === 'employer' && u.verification_status === 'pending' ? `<button onclick="approveUser('${u.id}','${fullName.replace(/'/g,"\\'")}')">✓ Approve</button>` : ''}
          ${u.role === 'employer' && u.verification_status !== 'rejected' ? `<button class="danger" onclick="rejectUser('${u.id}','${fullName.replace(/'/g,"\\'")}')">✕ Reject</button>` : ''}
          ${u.suspended
            ? `<button onclick="unsuspendUser('${u.id}','${fullName.replace(/'/g,"\\'")}')">↻ Unsuspend</button>`
            : `<button class="danger" onclick="suspendUser('${u.id}','${fullName.replace(/'/g,"\\'")}')">⊘ Suspend</button>`}
          ${!u.is_admin ? `<button onclick="makeAdmin('${u.id}','${fullName.replace(/'/g,"\\'")}')">⚙ Make Admin</button>` : `<button class="danger" onclick="removeAdmin('${u.id}','${fullName.replace(/'/g,"\\'")}')">Remove Admin</button>`}
          <button class="danger" onclick="deleteUser('${u.id}','${fullName.replace(/'/g,"\\'")}')">🗑 Delete User</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleMenu(e, id){
  e.stopPropagation();
  document.querySelectorAll('.dropdown').forEach(d => d.style.display = 'none');
  const menu = document.getElementById('menu-' + id);
  if(menu){
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    openMenu = menu;
  }
}

async function approveUser(id, name){
  if(!confirm(`Approve "${name}"?`)) return;
  const { error } = await sb.from('profiles').update({ verification_status: 'approved', is_verified: true }).eq('id', id);
  if(error){ alert('Error: ' + error.message); return; }
  await loadUsers();
}
async function rejectUser(id, name){
  const reason = prompt(`Reject "${name}"?\n\nReason (optional):`);
  if(reason === null) return;
  const { error } = await sb.from('profiles').update({ verification_status: 'rejected', is_verified: false, verification_note: reason || null }).eq('id', id);
  if(error){ alert('Error: ' + error.message); return; }
  await loadUsers();
}
async function suspendUser(id, name){
  const reason = prompt(`Suspend "${name}"?\n\nThis prevents them from logging in.\nReason (optional):`);
  if(reason === null) return;
  const { error } = await sb.from('profiles').update({ suspended: true, suspended_reason: reason || null }).eq('id', id);
  if(error){ alert('Error: ' + error.message); return; }
  await loadUsers();
}
async function unsuspendUser(id, name){
  if(!confirm(`Unsuspend "${name}"?`)) return;
  const { error } = await sb.from('profiles').update({ suspended: false, suspended_reason: null }).eq('id', id);
  if(error){ alert('Error: ' + error.message); return; }
  await loadUsers();
}
async function makeAdmin(id, name){
  if(!confirm(`Make "${name}" an admin? They will have FULL platform access.`)) return;
  const { error } = await sb.from('profiles').update({ is_admin: true }).eq('id', id);
  if(error){ alert('Error: ' + error.message); return; }
  await loadUsers();
}
async function removeAdmin(id, name){
  if(!confirm(`Remove admin from "${name}"?`)) return;
  const { error } = await sb.from('profiles').update({ is_admin: false }).eq('id', id);
  if(error){ alert('Error: ' + error.message); return; }
  await loadUsers();
}
async function deleteUser(id, name){
  if(!confirm(`Permanently delete "${name}" and ALL their data?\n\nThis cannot be undone.`)) return;
  const { error } = await sb.from('profiles').delete().eq('id', id);
  if(error){ alert('Error: ' + error.message); return; }
  await loadUsers();
}

function toggleUserMenu(e){
  e.stopPropagation();
  const menu = document.getElementById('user-menu');
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}
async function signOut(){
  await sb.auth.signOut();
  window.location.href = 'login.html';
}
document.addEventListener('click', () => {
  document.querySelectorAll('.dropdown').forEach(d => d.style.display = 'none');
  const menu = document.getElementById('user-menu');
  if(menu) menu.style.display = 'none';
});

init();
</script>
</body>
</html>

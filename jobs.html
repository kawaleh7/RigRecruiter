<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RigPass — Job Board</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1e3a8a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f8fafc;color:#0f172a;display:flex;min-height:100vh}
:root{
  --blue:#1e3a8a;--blue-mid:#1e40af;--blue-lt:#dbeafe;--blue-border:#93c5fd;
  --navy:#0a1228;--border:#e2e8f0;--text:#0f172a;--muted:#475569;--light:#94a3b8;
  --green:#166534;--green-bg:#f0fdf4;--red:#991b1b;--red-bg:#fef2f2;
  --amber:#92400e;--amber-bg:#fefce8;--gold:#b8923a;--gold-border:#c9963a;
  --off:#f8fafc;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06);
  --shadow:0 4px 14px rgba(15,23,42,.08);
  --shadow-lg:0 16px 40px rgba(15,23,42,.12);
}

/* ── SIDEBAR ── */
.sidebar{width:248px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sb-logo{padding:22px 22px 0;display:flex;align-items:center;gap:10px;text-decoration:none;margin-bottom:32px}
.logo-mark{width:34px;height:34px;background:var(--blue);border-radius:8px;display:grid;place-items:center;flex-shrink:0;box-shadow:0 4px 10px rgba(30,58,138,.25)}
.logo-mark svg{width:16px;height:16px;fill:#fff}
.logo-name{font-size:1.12rem;font-weight:800;color:var(--text)}
.logo-name span{color:var(--blue-mid)}
.sb-section{padding:0 12px;margin-bottom:6px}
.sb-label{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--light);padding:0 12px;margin-bottom:8px}
.sb-link{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-size:.88rem;font-weight:500;color:var(--muted);text-decoration:none;transition:all .15s;margin-bottom:2px;position:relative}
.sb-link:hover{background:#f1f5f9;color:var(--text)}
.sb-link.active{background:var(--blue-lt);color:var(--blue);font-weight:700}
.sb-link.active::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;background:var(--blue);border-radius:0 3px 3px 0}
.sb-link svg{width:17px;height:17px;flex-shrink:0}
.sb-badge{margin-left:auto;background:var(--red);color:#fff;font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:100px}
.sb-divider{height:1px;background:var(--border);margin:14px 22px}
.pro-card{margin:0 16px 12px;padding:16px;background:linear-gradient(135deg,#1e3a8a 0%,#0a1228 100%);border-radius:11px;color:#fff;position:relative;overflow:hidden}
.pro-card::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:rgba(147,197,253,.15)}
.pro-card-title{display:flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#93c5fd;margin-bottom:6px;position:relative}
.pro-card p{font-size:.78rem;color:rgba(255,255,255,.65);line-height:1.5;margin-bottom:12px;position:relative}
.pro-card button{width:100%;padding:8px;background:#fff;color:var(--blue);border:none;border-radius:7px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .15s;position:relative}
.pro-card button:hover{background:#f1f5f9}
.sb-bottom{margin-top:auto;padding:14px 12px;border-top:1px solid var(--border)}
.sb-user{display:flex;align-items:center;gap:11px;padding:10px;border-radius:9px;cursor:pointer;transition:background .15s}
.sb-user:hover{background:#f1f5f9}
.sb-avatar{width:36px;height:36px;border-radius:9px;background:var(--blue);display:grid;place-items:center;font-weight:800;font-size:.78rem;color:#fff;flex-shrink:0;box-shadow:0 2px 6px rgba(30,58,138,.25)}
.sb-uname{font-size:.86rem;font-weight:700;color:var(--text);line-height:1.2}
.sb-urole{font-size:.7rem;color:var(--muted);margin-top:2px}
.sb-arrow{margin-left:auto;color:var(--light)}

/* ── MAIN ── */
.main{margin-left:248px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-size:1.02rem;font-weight:800;color:var(--text)}
.topbar-right{display:flex;align-items:center;gap:10px}
.search-bar{position:relative;width:320px}
.search-bar input{width:100%;padding:8px 12px 8px 36px;border-radius:9px;border:1.5px solid var(--border);font-family:'Plus Jakarta Sans',sans-serif;font-size:.85rem;color:var(--text);outline:none;background:var(--off);transition:all .15s}
.search-bar input:focus{background:#fff;border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,58,138,.08)}
.search-bar svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--light)}
.icon-btn{width:38px;height:38px;border-radius:9px;border:1.5px solid var(--border);background:#fff;display:grid;place-items:center;cursor:pointer;position:relative;transition:all .15s}
.icon-btn:hover{border-color:var(--light);background:var(--off)}
.notif-dot{position:absolute;top:7px;right:7px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid #fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 18px;border-radius:9px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.86rem;font-weight:700;cursor:pointer;border:none;text-decoration:none;transition:all .15s;white-space:nowrap}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 10px rgba(30,58,138,.2)}
.btn-blue:hover{background:var(--blue-mid);transform:translateY(-1px);box-shadow:0 8px 16px rgba(30,58,138,.25)}
.btn-ghost{background:#fff;color:var(--muted);border:1.5px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--light)}
.btn-sm{padding:7px 14px;font-size:.78rem}
.btn-applied{background:var(--green-bg);color:var(--green);border:1.5px solid #86efac;cursor:default}

.content{display:flex;flex:1;overflow:hidden}

/* ── FILTER COL ── */
.filter-col{width:240px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);padding:24px 18px;overflow-y:auto}
.fp-head{font-size:.95rem;font-weight:800;color:var(--text);margin-bottom:18px;letter-spacing:-.1px;display:flex;align-items:center;justify-content:space-between}
.fp-clear{font-size:.74rem;color:var(--blue);font-weight:600;text-decoration:none;cursor:pointer;background:none;border:none;font-family:'Plus Jakarta Sans',sans-serif}
.fp-section{margin-bottom:20px}
.fp-label{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--light);margin-bottom:10px}
.fp-check{display:flex;align-items:center;gap:9px;margin-bottom:8px;cursor:pointer;padding:5px 0;border-radius:5px;transition:background .1s}
.fp-check:hover{padding-left:5px}
.fp-check input{width:16px;height:16px;accent-color:var(--blue);cursor:pointer;flex-shrink:0}
.fp-check span{font-size:.83rem;color:var(--text);font-weight:500}
.fp-check .fp-count{margin-left:auto;font-size:.72rem;color:var(--light);font-weight:600}
.fp-divider{height:1px;background:var(--border);margin:14px 0}

/* ── JOBS COL ── */
.jobs-col{flex:1;overflow-y:auto;padding:24px 32px;background:var(--off)}

/* MATCH BANNER */
.match-banner{
  background:linear-gradient(135deg,#1e3a8a 0%,#0a1228 100%);
  border-radius:14px;padding:20px 24px;
  display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;
  margin-bottom:20px;position:relative;overflow:hidden;color:#fff;
}
.match-banner::before{content:'';position:absolute;inset:0;opacity:.05;background-image:linear-gradient(rgba(255,255,255,1) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,1) 1px,transparent 1px);background-size:36px 36px}
.mb-ico{width:46px;height:46px;background:rgba(147,197,253,.15);border:1px solid rgba(147,197,253,.3);border-radius:11px;display:grid;place-items:center;flex-shrink:0;position:relative;z-index:2}
.mb-content{position:relative;z-index:2}
.mb-title{font-size:1rem;font-weight:800;color:#fff;letter-spacing:-.2px;margin-bottom:3px}
.mb-text{font-size:.83rem;color:rgba(255,255,255,.65);line-height:1.55;max-width:560px}
.mb-text strong{color:#fff}
.mb-action{position:relative;z-index:2}

.jobs-col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.results-count{font-size:.85rem;font-weight:600;color:var(--muted)}
.results-count strong{color:var(--text);font-weight:800}
.sort-select{padding:7px 14px;border:1.5px solid var(--border);border-radius:9px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.82rem;color:var(--text);outline:none;background:#fff;font-weight:600}

/* ── JOB CARDS ── */
.jcard{
  background:#fff;border-radius:14px;border:1.5px solid var(--gold-border);
  overflow:hidden;margin-bottom:14px;
  transition:all .2s;
  position:relative;
}
.jcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--gold)}
.jcard.full{border-color:var(--blue-border)}
.jcard.full:hover{border-color:var(--blue)}
.jcard-body{padding:22px 24px}
.jcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
.jcard-left{flex:1;min-width:0}
.jcard-co{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.co-avatar{width:36px;height:36px;border-radius:9px;background:var(--navy);display:grid;place-items:center;font-weight:800;font-size:.7rem;color:#fff;flex-shrink:0}
.co-info{display:flex;flex-direction:column}
.co-name{font-size:.82rem;font-weight:700;color:var(--text);line-height:1.2}
.co-tag{font-size:.7rem;color:var(--muted);font-weight:500;margin-top:1px}
.jcard-title{font-size:1.05rem;font-weight:800;color:var(--text);margin-bottom:10px;letter-spacing:-.2px;line-height:1.3}
.jcard-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted);margin-bottom:12px}
.jcard-meta span{display:flex;align-items:center;gap:5px}
.jcard-meta svg{opacity:.6;flex-shrink:0}
.pay-rate{font-weight:800;color:var(--green)!important}
.jcard-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.jtag{background:var(--off);border:1px solid var(--border);border-radius:100px;padding:3px 11px;font-size:.7rem;font-weight:700;color:var(--muted)}
.jtag.trade{background:var(--blue-lt);border-color:var(--blue-border);color:var(--blue)}

/* MATCH SCORE BADGE */
.match-score{
  flex-shrink:0;display:flex;flex-direction:column;align-items:center;
  background:var(--blue-lt);border-radius:11px;padding:10px 14px;
  border:1.5px solid var(--blue-border);min-width:80px;text-align:center;
}
.ms-num{font-size:1.35rem;font-weight:800;color:var(--blue);line-height:1;letter-spacing:-.5px}
.ms-label{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:3px}
.match-score.full{background:var(--green-bg);border-color:#86efac}
.match-score.full .ms-num{color:var(--green)}
.match-score.partial{background:var(--amber-bg);border-color:#fcd34d}
.match-score.partial .ms-num{color:var(--amber)}

/* CERT MATCH */
.cert-match{background:var(--off);border-radius:10px;padding:11px 14px;margin-bottom:14px;border:1px solid var(--border)}
.cm-title{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--light);margin-bottom:8px}
.cm-chips{display:flex;flex-wrap:wrap;gap:5px}
.cm-chip{display:inline-flex;align-items:center;gap:4px;border-radius:100px;padding:3px 10px;font-size:.7rem;font-weight:700}
.cm-ok{background:var(--green-bg);color:var(--green);border:1px solid #86efac}
.cm-missing{background:var(--red-bg);color:var(--red);border:1px solid #fda4af}
.cm-miss{background:var(--red-bg);color:var(--red);border:1px solid #fda4af}

.jcard-actions{display:flex;gap:8px;padding-top:14px;border-top:1px solid #f1f5f9;align-items:center}
.save-btn{margin-left:auto;width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:all .15s}
.save-btn:hover{border-color:var(--blue);color:var(--blue)}
.save-btn.saved{background:var(--blue-lt);border-color:var(--blue);color:var(--blue)}

/* RESPONSIVE */
@media(max-width:1024px){
  .filter-col{position:fixed;left:0;top:0;bottom:0;z-index:400;width:270px;transform:translateX(-100%);transition:transform .25s;box-shadow:8px 0 30px rgba(15,23,42,.18)}
  .filter-col.open{transform:translateX(0)}
  .jf-toggle{display:inline-flex !important}
  .jobs-col{padding:20px}
}
@media(max-width:768px){
  .sidebar{display:none}
  .main{margin-left:0}
  .search-bar{display:none}
  .match-banner{grid-template-columns:1fr;gap:14px}
  .mb-ico{display:none}
  .jcard-top{flex-direction:column}
  .match-score{align-self:flex-start;flex-direction:row;gap:7px;align-items:center;padding:6px 12px}
  .ms-num{font-size:1rem}
  .ms-label{margin-top:0}
}
</style>
</head>
<body>

<!-- ── SIDEBAR ── -->
<aside class="sidebar">
  <a class="sb-logo" href="index.html">
    <div class="logo-mark"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg></div>

    <a class="sb-link active" href="jobs.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>Job Board</a>
  </div>
  <div class="sb-divider"></div>
  <div class="sb-section">
    <div class="sb-label">Account</div>
    <a class="sb-link" href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</a>
  </div>
  <div class="sb-bottom">
    <div class="sb-user" onclick="toggleUserMenu(event)" style="position:relative">
      <div class="sb-avatar" id="sb-avatar">--</div>
      <div style="min-width:0"><div class="sb-uname" id="sb-uname">Loading...</div><div class="sb-urole" id="sb-urole">—</div></div>
      <svg class="sb-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      <div id="user-menu" style="display:none;position:absolute;bottom:100%;left:0;right:0;margin-bottom:8px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 32px rgba(15,23,42,.18);overflow:hidden;z-index:200">
        <a href="dashboard.html" style="display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:.85rem;color:var(--text);text-decoration:none;font-weight:600" onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background='#fff'">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <button onclick="signOut()" style="width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:.85rem;color:var(--red);background:#fff;border:none;border-top:1px solid #f1f5f9;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;text-align:left" onmouseover="this.style.background='#fef2f2'" onmouseout="this.style.background='#fff'">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    </div>
  </div>
</aside>

<!-- ── MAIN ── -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title">Job Board</div>
    <div class="topbar-right">
      <div class="search-bar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="Search by title, company, location..." oninput="render()">
      </div>
      <div class="icon-btn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <div class="notif-dot"></div>
      </div>
    </div>
  </div>

  <div class="content">

    <!-- ── FILTER COL ── -->
    <aside class="filter-col">
      <div class="fp-head">
        Filters
        <button class="fp-clear" onclick="clearJobFilters()">Clear all</button>
      </div>

      <div class="fp-section">
        <div class="fp-label">Province</div>
        <div id="jf-province"></div>
      </div>
      <div class="fp-divider"></div>

      <div class="fp-section">
        <div class="fp-label">Trade</div>
        <div id="jf-trade"></div>
      </div>
      <div class="fp-divider"></div>

      <div class="fp-section">
        <div class="fp-label">Job Type</div>
        <div id="jf-type"></div>
      </div>
      <div class="fp-divider"></div>

      <div class="fp-section">
        <div class="fp-label">Show Only</div>
        <label class="fp-check"><input type="checkbox" id="jf-fullmatch" onchange="render()"><span>Full cert matches</span></label>
        <label class="fp-check"><input type="checkbox" id="jf-invited" onchange="render()"><span>Invited jobs</span></label>
        <label class="fp-check"><input type="checkbox" id="jf-hideapplied" onchange="render()"><span>Hide jobs I applied to</span></label>
      </div>
    </aside>

    <!-- ── JOBS COL ── -->
    <div class="jobs-col">

      <!-- MATCH BANNER -->
      <!-- INVITATION BANNER -->
      <div id="invite-banner" style="display:none;align-items:flex-start;gap:12px;background:#eef2ff;border:1px solid #c7d2fe;border-radius:11px;padding:15px 18px;margin-bottom:18px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1e3a8a" stroke-width="2" style="flex-shrink:0;margin-top:1px"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <div id="invite-banner-text" style="font-size:.85rem;color:#1e3a8a;line-height:1.55;font-weight:500"></div>
      </div>

      <div class="match-banner" id="match-banner" style="display:none">
        <div class="mb-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#93c5fd" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg></div>
        <div class="mb-content">
          <div class="mb-title">Smart Matched For You</div>
          <div class="mb-text" id="match-banner-text">Calculating matches…</div>
        </div>
        <div class="mb-action">
          <a href="certifications.html" class="btn" style="background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.25)">Manage Tickets</a>
        </div>
      </div>

      <!-- HEADER -->
      <div class="jobs-col-head">
        <div class="results-count"><strong id="results-count">0</strong> open positions</div>
        <button class="jf-toggle" onclick="document.querySelector('.filter-col').classList.toggle('open')" style="display:none;align-items:center;gap:6px;padding:8px 13px;border:1.5px solid var(--border);border-radius:8px;background:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-size:.8rem;font-weight:700;color:var(--text);cursor:pointer;margin-right:8px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>Filters</button><select class="sort-select" id="sort-select" onchange="render()">
          <option value="match">Best Match</option>
          <option value="newest">Newest First</option>
          <option value="pay">Highest Pay</option>
        </select>
      </div>

      <!-- DYNAMIC JOB LIST -->
      <div id="jobs-list">
        <div style="padding:60px 22px;text-align:center;color:var(--light);font-size:.88rem">Loading jobs...</div>
      </div>

    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════
// SUPABASE
// ════════════════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://nbpyydgqqdozdpexmwlh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0g2EY2H1H6l93414OVlnlQ_GxqqL_o6';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;
let myCerts = [];
let myApplications = [];
let allJobs = [];
let myInvites = [];

// ════════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════════
async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'login.html'; return; }
  currentUser = session.user;

  const { data: profile } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();

  if(profile && profile.suspended && !profile.is_admin){
    alert('Your RigPass account has been suspended.' + (profile.suspended_reason ? '

Reason: ' + profile.suspended_reason : '') + '

Contact support if you believe this is a mistake.');
    await sb.auth.signOut();
    window.location.href = 'login.html';
    return;
  }
  if(!profile){ alert('Profile not found.'); window.location.href = 'login.html'; return; }
  currentProfile = profile;

  // Send non-workers elsewhere
  if(profile.role === 'employer'){ window.location.href = 'employer-dashboard.html'; return; }

  // Sidebar
  const first = profile.first_name || '';
  const last = profile.last_name || '';
  const fullName = (first + ' ' + last).trim() || currentUser.email.split('@')[0];
  const initials = ((first[0] || '') + (last[0] || '')).toUpperCase() || currentUser.email.substring(0,2).toUpperCase();
  document.getElementById('sb-avatar').textContent = initials;
  document.getElementById('sb-uname').textContent = fullName;
  const planLabel = profile.plan === 'pro' ? 'Pro Plan' : 'Free Plan';
  document.getElementById('sb-urole').textContent = (profile.trade || 'Worker') + ' · ' + planLabel;

  await loadData();
}

// ════════════════════════════════════════════════════════════════════
// LOAD DATA
// ════════════════════════════════════════════════════════════════════
async function loadData(){
  // My valid certs
  const { data: certs } = await sb.from('certifications').select('*').eq('worker_id', currentUser.id);
  myCerts = (certs || []).filter(c => !c.expiry_date || new Date(c.expiry_date) > new Date());

  // My existing applications (to mark "Applied")
  const { data: apps } = await sb.from('applications').select('*').eq('worker_id', currentUser.id);
  myApplications = apps || [];

  // My saved jobs
  await loadSavedJobs();

  // All active jobs with employer profile (for company name + verification)
  const { data: jobs } = await sb
    .from('jobs')
    .select('*, employer:profiles!jobs_employer_id_fkey(company_name, first_name, last_name, city, province, verification_status)')
    .eq('status', 'active')
    .order('published_at', { ascending: false });

  // VERIFICATION ENFORCEMENT: workers only see jobs from approved employers
  const verifiedJobs = (jobs || []).filter(j => j.employer && j.employer.verification_status === 'approved');

  // Invitations sent to this worker
  const { data: invites } = await sb.from('invitations')
    .select('*').eq('worker_id', currentUser.id).in('status', ['sent','viewed']);
  myInvites = invites || [];
  const invitedJobIds = new Set(myInvites.map(i => i.job_id));

  allJobs = verifiedJobs.map(job => ({
    ...job,
    matchPct: calculateMatch(job.required_certs || []),
    appliedRecord: myApplications.find(a => a.job_id === job.id) || null,
    invited: invitedJobIds.has(job.id)
  }));

  // Invited jobs float to the top
  allJobs.sort((a,b) => (b.invited ? 1 : 0) - (a.invited ? 1 : 0));

  // Invitation banner
  const pendingInvites = allJobs.filter(j => j.invited && !j.appliedRecord);
  const invBanner = document.getElementById('invite-banner');
  if(invBanner && pendingInvites.length > 0){
    invBanner.style.display = 'flex';
    document.getElementById('invite-banner-text').innerHTML =
      `<strong>You've been invited to apply!</strong> ${pendingInvites.length === 1
        ? `An employer wants you for "${pendingInvites[0].title}".`
        : `Employers invited you to ${pendingInvites.length} jobs.`} Invited candidates are far more likely to get hired — they're at the top of your list.`;
    // mark as viewed
    sb.from('invitations').update({ status: 'viewed' }).eq('worker_id', currentUser.id).eq('status', 'sent').then(() => {});
  }

  buildJobFilters();
  render();
  renderMatchBanner();
}

function calculateMatch(requiredCerts){
  if(!requiredCerts || requiredCerts.length === 0) return 100;
  const myValidCertNames = myCerts.map(c => c.name.toLowerCase());
  const matched = requiredCerts.filter(req =>
    myValidCertNames.some(my => my.includes(req.toLowerCase()) || req.toLowerCase().includes(my))
  ).length;
  return Math.round((matched / requiredCerts.length) * 100);
}

function renderMatchBanner(){
  const banner = document.getElementById('match-banner');
  if(allJobs.length === 0){ banner.style.display = 'none'; return; }

  const fullMatches = allJobs.filter(j => j.matchPct === 100).length;
  const partial = allJobs.filter(j => j.matchPct > 0 && j.matchPct < 100).length;

  if(myCerts.length === 0){
    banner.style.display = 'flex';
    document.getElementById('match-banner-text').innerHTML = `<strong>Add your safety tickets</strong> to see which jobs you fully qualify for.`;
  } else if(fullMatches > 0){
    banner.style.display = 'flex';
    document.getElementById('match-banner-text').innerHTML = `<strong>${fullMatches} job${fullMatches === 1 ? '' : 's'}</strong> fully match your certifications.${partial > 0 ? ` ${partial} more are partial matches.` : ''}`;
  } else {
    banner.style.display = 'none';
  }
}

// ════════════════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════════════════

// ════════════════════════════════════════════════════════════════════
// JOB FILTERS — built from real postings, real counts
// ════════════════════════════════════════════════════════════════════
let jobFilters = { province: new Set(), trade: new Set(), type: new Set() };

function buildJobFilters(){
  const countBy = (getter) => {
    const m = {};
    allJobs.forEach(j => { const v = getter(j); if(v) m[v] = (m[v] || 0) + 1; });
    return m;
  };
  const renderGroup = (containerId, counts, group) => {
    const el = document.getElementById(containerId);
    const keys = Object.keys(counts).sort((a,b) => counts[b] - counts[a]);
    el.innerHTML = keys.length === 0
      ? '<div style="font-size:.76rem;color:var(--light)">No data yet</div>'
      : keys.map(k => `
        <label class="fp-check">
          <input type="checkbox" ${jobFilters[group].has(k) ? 'checked' : ''} onchange="toggleJobFilter('${group}', '${k.replace(/'/g,"\\'")}', this.checked)">
          <span>${k}</span><span class="fp-count">${counts[k]}</span>
        </label>`).join('');
  };
  renderGroup('jf-province', countBy(j => j.province), 'province');
  renderGroup('jf-trade', countBy(j => j.trade), 'trade');
  renderGroup('jf-type', countBy(j => j.employment_type), 'type');
}

function toggleJobFilter(group, value, on){
  if(on) jobFilters[group].add(value); else jobFilters[group].delete(value);
  render();
}

function clearJobFilters(){
  jobFilters = { province: new Set(), trade: new Set(), type: new Set() };
  ['jf-fullmatch','jf-invited','jf-hideapplied'].forEach(id => { const el = document.getElementById(id); if(el) el.checked = false; });
  document.getElementById('search-input').value = '';
  buildJobFilters();
  render();
}

function render(){
  const list = document.getElementById('jobs-list');
  const search = document.getElementById('search-input').value.toLowerCase().trim();
  const sort = document.getElementById('sort-select').value;

  let filtered = allJobs.filter(j => {
    if(jobFilters.province.size && !jobFilters.province.has(j.province)) return false;
    if(jobFilters.trade.size && !jobFilters.trade.has(j.trade)) return false;
    if(jobFilters.type.size && !jobFilters.type.has(j.employment_type)) return false;
    if(document.getElementById('jf-fullmatch')?.checked && j.matchPct !== 100) return false;
    if(document.getElementById('jf-invited')?.checked && !j.invited) return false;
    if(document.getElementById('jf-hideapplied')?.checked && j.appliedRecord) return false;
    if(!search) return true;
    const haystack = [
      j.title, j.trade, j.city, j.province, j.description,
      j.employer?.company_name, j.employer?.first_name, j.employer?.last_name
    ].filter(Boolean).join(' ').toLowerCase();
    return haystack.includes(search);
  });

  // Sort
  if(sort === 'match'){
    filtered.sort((a,b) => b.matchPct - a.matchPct || new Date(b.published_at || b.created_at) - new Date(a.published_at || a.created_at));
  } else if(sort === 'newest'){
    filtered.sort((a,b) => new Date(b.published_at || b.created_at) - new Date(a.published_at || a.created_at));
  } else if(sort === 'pay'){
    filtered.sort((a,b) => (b.pay_max || b.pay_min || 0) - (a.pay_max || a.pay_min || 0));
  }

  document.getElementById('results-count').textContent = filtered.length;

  if(filtered.length === 0){
    if(allJobs.length === 0){
      list.innerHTML = `<div style="background:#fff;border:1.5px dashed var(--border);border-radius:14px;padding:60px 24px;text-align:center">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--light)" stroke-width="1.5" style="margin:0 auto 14px"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <p style="font-size:1rem;font-weight:800;color:var(--text);margin-bottom:6px">No jobs posted yet</p>
        <p style="font-size:.85rem;color:var(--muted)">Check back soon — new postings appear here as employers add them.</p>
      </div>`;
    } else {
      list.innerHTML = `<div style="padding:40px;text-align:center;color:var(--light);font-size:.88rem;background:#fff;border:1.5px dashed var(--border);border-radius:12px">No jobs match your search.</div>`;
    }
    return;
  }

  list.innerHTML = filtered.map(job => renderJobCard(job)).join('');
}

function renderJobCard(job){
  const company = job.employer?.company_name || ((job.employer?.first_name || '') + ' ' + (job.employer?.last_name || '')).trim() || 'Employer';
  const initials = company.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase() || 'EM';
  const loc = [job.city, job.province].filter(Boolean).join(', ') || 'Location TBD';
  const payLabel = job.pay_min && job.pay_max
    ? `$${job.pay_min}–$${job.pay_max}${job.pay_type==='hourly'?'/hr':job.pay_type==='daily'?'/day':''}`
    : job.pay_min ? `$${job.pay_min}+` : 'Pay TBD';
  const posted = timeAgo(job.published_at || job.created_at);
  const startDate = job.start_date ? new Date(job.start_date).toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}) : null;

  const matchPct = job.matchPct;
  const matchCls = matchPct === 100 ? 'full' : matchPct >= 50 ? 'partial' : 'low';

  // Cert chips
  const requiredCerts = job.required_certs || [];
  const myValidCertNames = myCerts.map(c => c.name.toLowerCase());
  const certChips = requiredCerts.map(req => {
    const hasIt = myValidCertNames.some(my => my.includes(req.toLowerCase()) || req.toLowerCase().includes(my));
    return `<span class="cm-chip ${hasIt ? 'cm-ok' : 'cm-missing'}">
      ${hasIt
        ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>'
        : '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'}
      ${req}
    </span>`;
  }).join('');

  const certTitle = requiredCerts.length === 0
    ? 'No specific certifications required'
    : matchPct === 100
    ? '✓ All Required Certifications Met'
    : matchPct >= 50
    ? `Partial Match — Missing ${requiredCerts.length - Math.round(matchPct * requiredCerts.length / 100)} cert${requiredCerts.length - Math.round(matchPct * requiredCerts.length / 100) === 1 ? '' : 's'}`
    : `${Math.round(matchPct * requiredCerts.length / 100)} of ${requiredCerts.length} certifications met`;

  // Apply button state
  const alreadyApplied = !!job.appliedRecord;
  const applyBtn = alreadyApplied
    ? `<button class="btn btn-applied" disabled><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Applied</button>`
    : `<button class="btn btn-blue" onclick="applyToJob('${job.id}', this)">Apply Now</button>`;

  return `<div class="jcard ${matchCls}">
    <div class="jcard-body">
      <div class="jcard-top">
        <div class="jcard-left">
          <div class="jcard-co">
            <div class="co-avatar" style="background:#1e3a8a">${initials}</div>
            <div class="co-info">
              <div class="co-name"><a href="employer-profile.html?id=${job.employer_id}" style="color:inherit;text-decoration:none">${company}</a></div>
              <div class="co-tag">Posted ${posted}</div>
            </div>
          </div>
          <div class="jcard-title">${job.invited ? '<span style="display:inline-flex;align-items:center;gap:4px;font-size:.64rem;font-weight:800;background:#1e3a8a;color:#fff;padding:3px 9px;border-radius:5px;text-transform:uppercase;letter-spacing:.5px;vertical-align:middle;margin-right:8px"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Invited</span>' : ''}${job.title}</div>
          <div class="jcard-meta">
            <span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${loc}</span>
            ${job.duration || job.schedule ? `<span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${[job.duration, job.schedule].filter(Boolean).join(' · ')}</span>` : ''}
            ${startDate ? `<span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Starts ${startDate}</span>` : ''}
            <span class="pay-rate">${payLabel}</span>
          </div>
          <div class="jcard-tags">
            ${job.trade ? `<span class="jtag trade">${job.trade}</span>` : ''}
            ${job.experience_level ? `<span class="jtag">${job.experience_level}</span>` : ''}
            ${job.camp_provided ? `<span class="jtag">Camp Provided</span>` : ''}
          </div>
          ${job.description ? `<div style="font-size:.84rem;color:var(--muted);line-height:1.6;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">${job.description.length > 220 ? job.description.substring(0,220) + '…' : job.description}</div>` : ''}
        </div>
        <div class="match-score ${matchCls}">
          <div class="ms-num">${matchPct}%</div>
          <div class="ms-label">Match</div>
        </div>
      </div>
      ${requiredCerts.length > 0 ? `<div class="cert-match">
        <div class="cm-title">${certTitle}</div>
        <div class="cm-chips">${certChips}</div>
      </div>` : ''}
      <div class="jcard-actions">
        ${applyBtn}
        <button class="save-btn ${savedJobIds.has(job.id) ? 'saved' : ''}" onclick="toggleSave(this, '${job.id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="${savedJobIds.has(job.id) ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
      </div>
    </div>
  </div>`;
}

// ════════════════════════════════════════════════════════════════════
// APPLY TO JOB
// ════════════════════════════════════════════════════════════════════
async function applyToJob(jobId, btn){
  // Rate limit: max 10 applications per day
  const oneDayAgo = new Date(Date.now() - 24*60*60*1000);
  const appsToday = myApplications.filter(a => new Date(a.applied_at || 0) > oneDayAgo).length;
  if(appsToday >= 10){
    alert("Daily application limit reached (10/day). Try again tomorrow.\n\nThis limit prevents spam and helps employers focus on genuine candidates.");
    return;
  }

  const job = allJobs.find(j => j.id === jobId);

  // SCREENING QUESTIONS: if job has them, collect answers first
  const questions = (job && job.screening_questions) || [];
  let screeningAnswers = [];
  if(questions.length > 0){
    for(const sq of questions){
      const ans = confirm(`Screening question from the employer:\n\n"${sq.q}"\n\nPress OK for YES, Cancel for NO.`);
      screeningAnswers.push({ q: sq.q, answer: ans ? 'yes' : 'no', dealbreaker: !!sq.dealbreaker });
      if(sq.dealbreaker && !ans){
        alert(`Unfortunately this job requires a YES to:\n\n"${sq.q}"\n\nYour application wasn't submitted — the employer set this as a hard requirement. If your situation changes, you can apply then.`);
        return;
      }
    }
  }

  btn.disabled = true;
  btn.style.opacity = '.6';
  const originalText = btn.innerHTML;
  btn.textContent = 'Applying...';

  const matchScore = job ? job.matchPct : 0;

  const { error } = await sb.from('applications').insert({
    job_id: jobId,
    worker_id: currentUser.id,
    status: 'pending',
    match_score: matchScore,
    screening_answers: screeningAnswers
  });

  if(error){
    if(error.code === '23505'){ // unique violation
      alert('You\'ve already applied to this job.');
    } else {
      alert('Error applying: ' + error.message);
    }
    btn.disabled = false;
    btn.style.opacity = '1';
    btn.innerHTML = originalText;
    return;
  }

  // Update local state (include applied_at for rate limit)
  myApplications.push({ job_id: jobId, worker_id: currentUser.id, status: 'pending', applied_at: new Date().toISOString() });
  if(job) job.appliedRecord = { status: 'pending' };

  // If this job was an invitation, mark it applied
  sb.from('invitations').update({ status: 'applied' }).eq('worker_id', currentUser.id).eq('job_id', jobId).then(() => {});

  btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Applied';
  btn.className = 'btn btn-applied';
  btn.disabled = true;
  btn.style.opacity = '1';
}

let savedJobIds = new Set();

async function loadSavedJobs(){
  const { data } = await sb.from('saved_jobs').select('job_id').eq('worker_id', currentUser.id);
  savedJobIds = new Set((data || []).map(s => s.job_id));
}

async function toggleSave(btn, jobId){
  const isSaved = savedJobIds.has(jobId);
  btn.disabled = true;

  if(isSaved){
    const { error } = await sb.from('saved_jobs').delete().eq('worker_id', currentUser.id).eq('job_id', jobId);
    if(!error){ savedJobIds.delete(jobId); btn.classList.remove('saved'); btn.querySelector('svg').setAttribute('fill', 'none'); }
    else { alert('Error: ' + error.message); }
  } else {
    const { error } = await sb.from('saved_jobs').insert({ worker_id: currentUser.id, job_id: jobId });
    if(!error){ savedJobIds.add(jobId); btn.classList.add('saved'); btn.querySelector('svg').setAttribute('fill', 'currentColor'); }
    else { alert('Error: ' + error.message); }
  }
  btn.disabled = false;
}

function timeAgo(dateStr){
  if(!dateStr) return 'recently';
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diff / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if(hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  if(days < 30) return days + 'd ago';
  const months = Math.floor(days / 30);
  return months + 'mo ago';
}

// USER MENU + SIGN OUT
// ════════════════════════════════════════════════════════════════════
function toggleUserMenu(e){
  e.stopPropagation();
  const menu = document.getElementById('user-menu');
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}
async function signOut(){
  await sb.auth.signOut();
  window.location.href = 'login.html';
}
document.addEventListener('click', (e) => {
  const menu = document.getElementById('user-menu');
  if(menu && !e.target.closest('.sb-user')) menu.style.display = 'none';
});

init();
</script>
